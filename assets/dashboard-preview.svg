<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f3efe6"/><text x="58" y="56" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#101010">GYMSHARK / EUROPE</text><rect x="982" y="31" width="160" height="35" rx="17" fill="none" stroke="#cfc8bb"/><text x="1005" y="54" font-family="Arial,sans-serif" font-size="12" fill="#706f69">MARKET ENTRY CASE</text><text x="58" y="125" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#ef4b3f">DESK RESEARCH → DECISION</text><text x="58" y="186" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#101010">从公开信息中，形成一项</text><text x="58" y="241" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#101010">可验证的欧洲进入决策</text><text x="58" y="287" font-family="Arial,sans-serif" font-size="17" fill="#706f69">市场选择 · 目标人群 · 产品主张 · 6 周验证</text><rect x="804" y="111" width="338" height="181" rx="22" fill="#101010"/><text x="832" y="145" font-family="Arial,sans-serif" font-size="12" fill="#aaaaaa">RECOMMENDATION</text><text x="832" y="185" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff">先做 6 周小范围验证</text><text x="832" y="220" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#ffffff">再决定是否进入</text><text x="832" y="258" font-family="Arial,sans-serif" font-size="14" fill="#c9c9c9">2 个国家 · 1 个核心人群 · 3 个基础款</text><text x="58" y="358" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#101010">研究如何支持决策</text><g font-family="Arial,sans-serif"><rect x="58" y="386" width="341" height="182" rx="18" fill="#fffdf8" stroke="#d9d4c8"/><text x="82" y="416" font-size="12" font-weight="700" fill="#ef4b3f">01 / CATEGORY</text><text x="82" y="466" font-size="22" font-weight="700">社区内容是入口</text><text x="82" y="505" font-size="14" fill="#706f69">先验证需求，再决定库存与渠道。</text><rect x="429" y="386" width="341" height="182" rx="18" fill="#fffdf8" stroke="#d9d4c8"/><text x="453" y="416" font-size="12" font-weight="700" fill="#ef4b3f">02 / POSITION</text><text x="453" y="466" font-size="22" font-weight="700">中端价格仍有空间</text><text x="453" y="505" font-size="14" fill="#706f69">专业训练体验 + 更易接受价格。</text><rect x="800" y="386" width="342" height="182" rx="18" fill="#fffdf8" stroke="#d9d4c8"/><text x="824" y="416" font-size="12" font-weight="700" fill="#ef4b3f">03 / RISK</text><text x="824" y="466" font-size="22" font-weight="700">尺码与退换决定口碑</text><text x="824" y="505" font-size="14" fill="#706f69">产品验证应先于营销放量。</text></g><text x="58" y="608" font-family="Arial,sans-serif" font-size="12" fill="#706f69">Market Research · Positioning · Validation</text></svg>